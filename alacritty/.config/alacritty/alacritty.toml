[general]
# This line is the most important; it imports the colors Matugen generates
import = [
    "~/.config/alacritty/colors.toml"
]

[window]
# Adds space between the text and the window borders
padding = { x = 12, y = 12 }

# Adjust for a "glass" look; requires a compositor like Hyprland or Picom
opacity = 0.8
blur = true

# Removes title bars for a cleaner look
decorations = "None"

[font]
# Replace with your preferred font (e.g., "FiraCode Nerd Font")
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[cursor]
# Selection of Block, Beam, or Underline
style = { shape = "Block", blinking = "On" }
blink_interval = 500

[scrolling]
history = 10000

[selection]
# Set to true to automatically copy selected text to the clipboard
save_to_clipboard = true

[env]
# Standard terminal environment variable
TERM = "xterm-256color"
