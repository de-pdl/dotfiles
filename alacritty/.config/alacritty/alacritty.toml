[general]
# This imports the colors generated by Matugen
import = ["~/.config/alacritty/colors.toml"]

[window]
padding = { x = 12, y = 12 }
dynamic_title = true
opacity = 0.9
blur = true

[font]
# Use the "Mono" version specifically to prevent character overlap
normal = { family = "JetBrainsMono NL", style = "Regular" }
bold = { family = "JetBrainsMono NL ExtraBold", style = "Bold" }
size = 11.0

[cursor]
style = { shape = "Beam", blinking = "Always" }
