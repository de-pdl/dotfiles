[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background}
label-active-foreground = ${colors.primary}
label-active-underline= ${colors.foreground}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1
label-occupied-background = ${colors.background}

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 1

pin-workspaces = true

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%
label-foreground = ${colors.primary}
label-background = ${colors.background}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.secondary}
format-volume-background = ${colors.background}
label-volume = %percentage%%

label-muted = "󰝟 "
label-muted-foreground = ${colors.disabled}
label-muted-background = ${colors.background}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.secondary}
format-background = ${colors.background}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-background = ${colors.background}
format-prefix-foreground = ${colors.secondary}
label = %percentage:2%%

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format-background = ${colors.background}

format-prefix = "󰃭 "
format-prefix-foreground = ${colors.secondary}
label = %date%

[module/left-pill]
type = custom/text
# This is a solid left semi-circle (Nerd Font: \ue0b6)
format = ""
#format-foreground = ${colors.teritiary}
format-foreground = ${colors.background}
format-font = 4

[module/right-pill]
type = custom/text
# This is a solid right semi-circle (Nerd Font: \ue0b4)
format = ""
format-foreground = ${colors.background}
format-font = 4

[module/tray]
type = internal/tray
format-background = ${colors.background}
format-foreground = ${colors.background}
tray-background = ${colors.background}
tray-spacing = 8px
tray-padding = 10
tray-size = 50%

[module/battery]
type = internal/battery

battery = BAT1
adapter = ADP1

;-- Most batteries never hit 100%
full-at = 98

format-charging = <animation-charging><label-charging>
format-discharging = <ramp-capacity><label-discharging>
format-full = <ramp-capacity><label-full>

format-charging-background = ${colors.background}
format-discharging-background = ${colors.background}
format-full-background = ${colors.background}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

label-charging-background = ${colors.background}
label-discharging-background = ${colors.background}
label-full-background = ${colors.background}

format-background = ${colors.background}

ramp-capacity-0 =   
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 =   
ramp-capacity-2 =   
ramp-capacity-3 =   
ramp-capacity-4 =   
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-background = ${colors.background}

animation-charging-0 =  
animation-charging-1 =  
animation-charging-2 =  
animation-charging-3 =  
animation-charging-4 =   
animation-charging-foreground = ${colors.primary}
animation-charging-framerate = 750
animation-charging-background = ${colors.background}


[module/sep]
type = custom/text
# Use the pipe symbol or a Nerd Font thin line (󰇙)
format = " | "
format-font = 4
format-foreground = ${colors.disabled}
format-background = ${colors.background}

[module/sep_space]
type = custom/text
format = " "
format-font = 4
format-foreground = ${colors.disabled}
format-background = ${colors.background}
