# ~/.config/matugen/templates/dunst-colors.ini
# Generated by matugen

[urgency_low]
    background = "{{colors.background.default.hex}}"
    foreground = "{{colors.secondary.default.hex}}"

[urgency_normal]
    background = "{{colors.background.default.hex}}"
    foreground = "{{colors.primary.default.hex}}"

[urgency_critical]
    background = "{{colors.background.default.hex}}"
    foreground = "{{colors.error.default.hex}}"
    frame_color = "{{colors.error.default.hex}}"

[spotify]
    desktop_entry = spotify
    foreground = "{{colors.secondary.default.hex}}"

[discord]
    desktop_entry = discord
    foreground = "{{colors.tertiary.default.hex}}"
